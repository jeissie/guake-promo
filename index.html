<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>添加客服微信 · 医路相伴</title>
<meta name="description" content="长按识别二维码，添加客服微信咨询。">

<!-- 百度统计（2026-11-12 加回）：本页不再有整页跳转，会正常停留展示，
     统计脚本能正常加载并上报（此前把统计放在跳转之后会连加载都发生不了） -->
<script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?d10d2567d18411747f910ce76cd0412a";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
</script>
<style>
    /* ==================== 添加客服微信页（index.html；weixin.html 为同内容副本） ====================
       2026-11-12 新建。仿微信「朋友资料」页：身份区（头像 + 名字 + @企业简称）
       → 引导语 → 底部居中二维码。整页白底，微信内打开长按识别即可添加。
       ⚠️ 二维码图片是 qrcode_contact.png（企业微信「联系我」码，396×396）。
          换码时只替换这张图即可，尺寸不用改。
       ⚠️ 本页不做跳转、不埋统计；若哪天要跳转/埋点，注意 [[index.html]] 那套整页跳转
          会吃掉统计上报（见 index.html 顶部注释），别照抄。
    ======================================================================= */
    :root {
        --ink: #191919;
        --muted: #8a8a8a;
        --wechat: #07c160;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
        background: #fff; color: var(--ink);
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex; flex-direction: column;
        padding: 0 24px calc(22px + env(safe-area-inset-bottom));
    }

    /* ==================== 身份区：头像 + 名字 + @企业简称 ==================== */
    .identity {
        display: flex; align-items: center; gap: 14px;
        padding: 38px 0 22px;
    }
    .avatar {
        flex: 0 0 auto; width: 58px; height: 58px; border-radius: 15px;
        background: linear-gradient(145deg, #eafaf1, #d6f3e3);
        display: flex; align-items: center; justify-content: center;
    }
    .avatar svg { width: 30px; height: 30px; display: block; }
    .who .name { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
    .who .sub  { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ==================== 引导语 ==================== */
    .guide { padding-top: 4px; }
    .guide h1 { margin: 0; font-size: 22px; line-height: 1.45; font-weight: 600; }
    .guide p  { margin: 10px 0 0; font-size: 14px; line-height: 1.75; color: #555; }
    .plats { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .plats span {
        font-size: 12px; color: #0d6b3f;
        background: #f1fbf5; border: 1px solid #cdeedd;
        border-radius: 999px; padding: 4px 10px;
    }

    /* ==================== 二维码：紧跟平台标签下方、水平居中 ====================
       2026-11-12 用户要求：原来用 margin-top:auto 把这一块压到屏幕最底部，位置太低，
       改为直接跟在「华医网 / 陕西继续教育 / 放射考试网」标签下面，只留一点间距。 */
    .qr-block { margin-top: 26px; text-align: center; }
    .qr-block img {
        display: block; margin: 0 auto;
        width: min(68vw, 280px); height: auto;
    }
    .qr-tip { margin-top: 16px; font-size: 15px; font-weight: 600; color: var(--ink); }
    .qr-tip b { color: var(--wechat); }
    .qr-note { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

    /* 矮屏（如 iPhone SE）压缩留白，保证二维码完整可见 */
    @media (max-height: 700px) {
        .identity { padding: 22px 0 14px; }
        .guide h1 { font-size: 20px; }
        .qr-block { margin-top: 16px; }
        .qr-block img { width: min(58vw, 220px); }
        .qr-tip { margin-top: 12px; }
    }
</style>
</head>
<body>

    <!-- ============ 身份区（仿微信「朋友资料」页） ============ -->
    <div class="identity">
        <div class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#07c160" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.6a8.4 8.4 0 0 1-8.6 8.3 9.4 9.4 0 0 1-2.9-.5L4 21l1.6-4.2A8.2 8.2 0 0 1 4 11.6A8.4 8.4 0 0 1 12.6 3.3 8.4 8.4 0 0 1 21 11.6z"/>
            </svg>
        </div>
        <div class="who">
            <div class="name">医路相伴</div>
            <div class="sub">@信彼南 · 人工客服</div>
        </div>
    </div>

    <!-- ============ 引导语 ============ -->
    <div class="guide">
        <h1>添加客服微信</h1>
        <p>长按下方二维码识别，即可添加客服微信；添加后可直接咨询。</p>
        <div class="plats">
            <span>华医网</span>
            <span>陕西继续教育</span>
            <span>放射考试网</span>
        </div>
    </div>

    <!-- ============ 二维码（底部居中） ============ -->
    <div class="qr-block">
        <img src="qrcode_contact.png" alt="微信客服二维码" width="396" height="396">
        <div class="qr-tip">长按识别二维码，<b>添加客服微信</b></div>
        <div class="qr-note">也可截图后用微信「扫一扫」从相册识别</div>
    </div>

</body>
</html>
